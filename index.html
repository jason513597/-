
<!DOCTYPE html>
<html lang="zh-TW" data-theme="kirara">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldLine | AI Digital Asset Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Fira+Code:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAF8F5; --bg-card: rgba(255, 255, 255, 0.8); --accent: #FFB7C5;
            --text-main: #7D6E6E; --radius: 2rem; --font: 'Zen Maru Gothic', sans-serif;
            --transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        html[data-theme="cyberpunk"] {
            --bg-primary: #0D0E15; --bg-card: rgba(22, 27, 34, 0.8); --accent: #00F0FF;
            --text-main: #A0A0A0; --radius: 0px; --font: 'Fira Code', monospace;
            --transition: all 0.1s steps(4);
        }
        html[data-theme="minimal"] {
            --bg-primary: #FFFFFF; --bg-card: rgba(245, 245, 245, 0.5); --accent: #000000;
            --text-main: #333333; --radius: 0.75rem; --font: 'Inter', sans-serif;
            --transition: all 0.4s ease-in-out;
        }
        body {
            background-color: var(--bg-primary); color: var(--text-main);
            font-family: var(--font); transition: var(--transition);
            min-height: 100vh; overflow-x: hidden;
        }
        .world-card {
            background: var(--bg-card); border: 2px solid var(--accent);
            border-radius: var(--radius); transition: var(--transition);
            backdrop-filter: blur(12px);
        }
        .btn-primary {
            background-color: var(--accent); color: white;
            border-radius: var(--radius); transition: var(--transition);
            box-shadow: 0 4px 0px rgba(0,0,0,0.1);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 0px rgba(0,0,0,0.1); filter: brightness(1.1); }
        .btn-primary:active { transform: translateY(2px); box-shadow: 0 0px 0px rgba(0,0,0,0.1); }

        .glitch { animation: glitch 1s linear infinite; }
        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }
        .petal {
            position: absolute; background-color: var(--accent);
            border-radius: 150% 0 150% 0; opacity: 0.6;
            pointer-events: none; animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body x-data="worldLineEngine()" x-init="init()">
    <div id="bg-effects" class="fixed inset-0 -z-10 pointer-events-none"></div>

    <div class="max-w-5xl mx-auto px-6 py-12 space-y-12">
        <header class="flex justify-between items-center">
            <div class="text-2xl font-bold glitch" x-text="themeData[currentTheme].brand"></div>
            <button @click="roll()" class="btn-primary px-6 py-3 font-bold flex items-center gap-2">
                <span>🎲 隨機世界線</span>
            </button>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
            <div class="space-y-8">
                <div class="world-card p-12 space-y-6 shadow-2xl relative overflow-hidden">
                    <div class="inline-block px-3 py-1 text-xs font-bold bg-current text-white rounded-full mb-4" style="background-color: var(--accent)">AI-Powered Store</div>
                    <h1 class="text-6xl font-bold leading-tight" x-text="themeData[currentTheme].title"></h1>
                    <p class="text-xl opacity-80 leading-relaxed" x-text="themeData[currentTheme].desc"></p>
                    <div class="flex flex-wrap gap-4 pt-4">
                        <a href="#store" class="btn-primary px-8 py-4 font-bold text-lg">立即獲取資產 ➔</a>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="world-card p-6 space-y-3 h-40 flex flex-col justify-end">
                    <div class="text-xs font-bold opacity-50 uppercase tracking-widest">Speed</div>
                    <div class="text-2xl font-bold">Edge-Ready</div>
                    <p class="text-sm opacity-70">全球加速, 零延遲載入</p>
                </div>
                <div class="world-card p-6 space-y-3 h-40 flex flex-col justify-end">
                    <div class="text-xs font-bold opacity-50 uppercase tracking-widest">Visuals</div>
                    <div class="text-2xl font-bold">AI-Native</div>
                    <p class="text-sm opacity-70">跨維度的視覺切換</p>
                </div>
                <div class="world-card p-6 space-y-3 h-40 flex flex-col justify-end col-span-2">
                    <div class="text-xs font-bold opacity-50 uppercase tracking-widest">Profit Model</div>
                    <div class="text-2xl font-bold">Zero-Dialogue</div>
                    <p class="text-sm opacity-70">全自動發貨, 零溝通變現模式。</p>
                </div>
            </div>
        </main>

        <!-- Digital Store Section -->
        <section id="store" class="py-20 text-center space-y-12">
            <div class="space-y-4">
                <h2 class="text-4xl font-bold" x-text="themeData[currentTheme].storeTitle"></h2>
                <p class="opacity-60">直接購買數位資產，無需溝通，立即交付。</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="world-card p-8 space-y-4 hover:scale-105 transition-transform">
                    <div class="text-4xl">📦</div>
                    <h3 class="text-xl font-bold">WorldLine 模板</h3>
                    <p class="text-sm opacity-70">獲得本站的完整 HTML/CSS 框架與世界線切換代碼</p>
                    <div class="text-3xl font-bold" x-text="themeData[currentTheme].price1"></div>
                    <button class="btn-primary w-full py-3 font-bold">立即購買</button>
                </div>
                <div class="world-card p-8 space-y-4 hover:scale-105 transition-transform border-4 shadow-xl" style="border-color: var(--accent)">
                    <div class="text-4xl">📜</div>
                    <h3 class="text-xl font-bold">AI 建站指令集</h3>
                    <p class="text-sm opacity-70">我用來生成此網站的所有精準 Prompt 庫</p>
                    <div class="text-3xl font-bold" x-text="themeData[currentTheme].price2"></div>
                    <button class="btn-primary w-full py-3 font-bold">最受歡迎</button>
                </div>
                <div class="world-card p-8 space-y-4 hover:scale-105 transition-transform">
                    <div class="text-4xl">💎</div>
                    <h3 class="text-xl font-bold">AI 獲利指南 (PDF)</h3>
                    <p class="text-sm opacity-70">從零到一建立自動化數位資產的完整操作流程</p>
                    <div class="text-3xl font-bold" x-text="themeData[currentTheme].price3"></div>
                    <button class="btn-primary w-full py-3 font-bold">立即獲取</button>
                </div>
            </div>
        </section>
    </div>

    
        <!-- AI Tool Hub & Tipping Wall (New Profit Modules) -->
        <section class="py-20 grid grid-cols-1 md:grid-cols-2 gap-12">
            <div class="world-card p-8 space-y-6 shadow-lg">
                <h3 class="text-2xl font-bold flex items-center gap-2">
                    <span>🛠️</span> <span x-text="themeData[currentTheme].toolTitle"></span>
                </h3>
                <div class="space-y-4">
                    <template x-for="tool in themeData[currentTheme].tools">
                        <div class="flex justify-between items-center p-3 bg-black bg-opacity-5 rounded-xl hover:bg-opacity-10 transition-all cursor-pointer border border-transparent hover:border-current">
                            <div>
                                <div class="font-bold" x-text="tool.name"></div>
                                <div class="text-xs opacity-60" x-text="tool.desc"></div>
                            </div>
                            <div class="text-xs font-bold btn-primary px-3 py-1">Try Now ➔</div>
                        </div>
                    </template>
                </div>
            </div>
            <div class="world-card p-8 space-y-6 shadow-lg flex flex-col justify-center text-center">
                <div class="text-4xl">☕</div>
                <h3 class="text-2xl font-bold" x-text="themeData[currentTheme].tipTitle"></h3>
                <p class="text-sm opacity-70" x-text="themeData[currentTheme].tipDesc"></p>
                <button class="btn-primary w-full py-4 font-bold text-lg">支持創作者 (Buy Me a Coffee)</button>
            </div>
        </section>
        <div class="h-12"></div>
    
<!-- AI Assistant -->
    <div class="fixed bottom-8 right-8 w-80 world-card p-5 shadow-2xl space-y-4 animate-bounce-subtle">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full border-2 border-current" :style="{backgroundColor: themeData[currentTheme].avatar}"></div>
            <div>
                <div class="font-bold text-sm" x-text="themeData[currentTheme].aiName"></div>
                <div class="text-[10px] opacity-50">Auto-Sales Agent</div>
            </div>
        </div>
        <div class="bg-black bg-opacity-10 p-4 rounded-xl text-sm italic leading-relaxed" x-text="themeData[currentTheme].aiMsg"></div>
    </div>

    <script>
        function worldLineEngine() {
            return {
                currentTheme: 'kirara',
                
    themeData: {
        kirara: {
            brand: "🌸 Akira's Garden",
            title: "歡迎來到我的數位花園",
            desc: "將 AI 的冷冰冰轉化為療癒的視覺。在這裡，你可以買到讓網站變溫柔的魔法。",
            storeTitle: "把溫柔與美感帶回你的網站",
            price1: "$29", price2: "$49", price3: "$99",
            aiName: "小櫻 (Kirara AI)",
            aiMsg: "你好呀🌸！如果你也想要一個像這樣可愛的網站，直接在下面挑選你喜歡的產品吧！",
            avatar: "#FFB7C5",
            toolTitle: "🌸 推薦的療癒工具",
            tools: [
                {name: "Midjourney", desc: "創造夢幻般視覺的頂級 AI"},
                {name: "Canva AI", desc: "快速設計可愛視覺素材"},
                {name: "Luma AI", desc: "將想像轉化為 3D 療癒空間"}
            ],
            tipTitle: "請我喝杯奶茶 🌸",
            tipDesc: "如果你喜歡這裡的氛圍，可以用一杯奶茶支持我的創作！"
        },
        cyberpunk: {
            brand: "⚡ AKIRA.EXE",
            title: "CORE ASSETS UNLOCKED",
            desc: "放棄低效的傳統開發。直接獲取經過驗證的 AI 指令集，快速建立你的數位帝國。",
            storeTitle: "獲取最高效率的數位武器",
            price1: "¥ 2,000", price2: "¥ 5,000", price3: "¥ 10,000",
            aiName: "Unit-01 (Core AI)",
            aiMsg: "[SYSTEM]: 偵測到潛在客戶。建議立即購買指令集以提升開發效率。",
            avatar: "#00F0FF",
            toolTitle: "⚡ 高性能黑客工具",
            tools: [
                {name: "Cursor AI", desc: "目前最強的 AI 代碼編輯器"},
                {name: "v0.dev", desc: "對話即生成頂級 UI 組件"},
                {name: "Vercel", desc: "全球最快的 Edge 部署平台"}
            ],
            tipTitle: "注入能源 (Energy Boost) ⚡",
            tipDesc: "支持本系統的運算與維護，讓數位帝國持續擴張。"
        },
        minimal: {
            brand: "Akira. Studio",
            title: "Digital Asset Archive",
            desc: "專注於本質的數位產品。剔除所有冗餘，僅提供最高質量的 AI 建站方案。",
            storeTitle: "精選數位資產清單",
            price1: "€ 25", price2: "€ 45", price3: "€ 89",
            aiName: "Studio Assistant",
            aiMsg: "您好。我為您準備了三款高效的數位產品，請根據您的需求選擇。",
            avatar: "#000000",
            toolTitle: "✨ 極簡生產力工具",
            tools: [
                {name: "Claude 3.5", desc: "邏輯最強的 AI 協作夥伴"},
                {name: "Notion AI", desc: "打造你的第二大腦知識庫"},
                {name: "Linear", desc: "最頂級的項目管理體驗"}
            ],
            tipTitle: "支持極簡主義 ✨",
            tipDesc: "如果您認同簡約之美，歡迎給予小額支持。"
        }
    },
    init() {
                    this.roll();
                },
                roll() {
                    const themes = Object.keys(this.themeData);
                    this.currentTheme = themes[Math.floor(Math.random() * themes.length)];
                    document.documentElement.setAttribute('data-theme', this.currentTheme);
                    this.updateEffects();
                },
                updateEffects() {
                    const container = document.getElementById('bg-effects');
                    container.innerHTML = '';
                    if (this.currentTheme === 'kirara') {
                        for(let i=0; i<25; i++) {
                            const petal = document.createElement('div');
                            petal.className = 'petal';
                            petal.style.left = Math.random() * 100 + 'vw';
                            petal.style.width = Math.random() * 10 + 5 + 'px';
                            petal.style.height = petal.style.width;
                            petal.style.animationDuration = Math.random() * 3 + 5 + 's';
                            petal.style.animationDelay = Math.random() * 5 + 's';
                            container.appendChild(petal);
                        }
                    } else if (this.currentTheme === 'cyberpunk') {
                        container.style.background = 'linear-gradient(rgba(0,240,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,0.05) 1px, transparent 1px)';
                        container.style.backgroundSize = '50px 50px';
                    } else {
                        container.style.background = 'none';
                    }
                }
            }
        }
    </script>
</body>
</html>

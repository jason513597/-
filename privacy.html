
<!DOCTYPE html>

<body class="p-8 md:p-20 max-w-3xl mx-auto space-y-8">
    <a href="index.html" class="text-pink-400 hover:underline">← 返回首頁</a>
    <h1 class="text-3xl font-bold border-b-2 border-pink-200 pb-4">隱私權條款</h1>
    <div class="space-y-6 leading-relaxed">
        <p>本網站（以下簡稱「本站」）非常重視您的隱私權。本條款說明我們如何收集、使用及保護您的個人資訊。</p>
        <section class="space-y-2">
            <h2 class="text-xl font-bold">1. 收集之資訊</h2>
            <p>我們僅在您購買數位產品或聯繫客服時，收集必要的資訊，包括但不限於：電子郵件地址、姓名及付款證明。</p>
        </section>
        <section class="space-y-2">
            <h2 class="text-xl font-bold">2. 資訊用途</h2>
            <p>收集之資訊僅用於：(1) 交付數位產品 (2) 驗證付款狀態 (3) 回覆客服詢問。</p>
        </section>
        <section class="space-y-2">
            <h2 class="text-xl font-bold">3. 資料安全</h2>
            <p>我們承諾不會將您的個人資訊出售或洩漏給任何第三方。所有付款流程均透過第三方金流平台 (如藍新金流) 加密處理。</p>
        </section>
    </div>
    <footer class="pt-12 text-center opacity-50 text-sm">© 2026 阿基拉花園</footer>

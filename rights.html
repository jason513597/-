
<!DOCTYPE html>

<body class="p-8 md:p-20 max-w-3xl mx-auto space-y-8">
    <a href="index.html" class="text-pink-400 hover:underline">← 返回首頁</a>
    <h1 class="text-3xl font-bold border-b-2 border-pink-200 pb-4">消費者權益說明</h1>
    <div class="space-y-6 leading-relaxed">
        <p>本站致力於提供透明且公平的交易環境。請在購買前詳閱以下權益說明：</p>
        <section class="space-y-2">
            <h2 class="text-xl font-bold">1. 數位商品特性</h2>
            <p>本站銷售之商品均為「數位內容」（如：PDF 指南、代碼模板），不具實體形式。</p>
        </section>
        <section class="space-y-2">
            <h2 class="text-xl font-bold">2. 退款政策</h2>
            <p>由於數位商品之特性，一旦付款成功且交付連結後，即視為服務已完成交付，恕不接受任何理由之退款申請。請在購買前確認商品詳細內容。</p>
        </section>
        <section class="space-y-2">
            <h2 class="text-xl font-bold">3. 交付承諾</h2>
            <p>我們承諾在確認收到款項後，於 3 個工作天內將產品發送至您的指定聯繫方式。若超過期限未收到，請聯繫客服信箱。</p>
        </section>
    </div>
    <footer class="pt-12 text-center opacity-50 text-sm">© 2026 阿基拉花園</footer>
